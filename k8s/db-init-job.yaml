apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-credentials
                  key: sa-password
          command:
            - /bin/bash
            - -c
            - >
              until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$(MSSQL_SA_PASSWORD)" -C -Q "SELECT 1"; do
                echo "waiting for sqlserver...";
                sleep 5;
              done
      containers:
        - name: db-init
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-credentials
                  key: sa-password
          command:
            - /bin/bash
            - -c
            - >
              /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$(MSSQL_SA_PASSWORD)" -C -i /scripts/schema.sql;
              /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$(MSSQL_SA_PASSWORD)" -C -i /scripts/seed.sql;
              exit 0
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: db-init-scripts
